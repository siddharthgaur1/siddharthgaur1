<svg width="1200" height="260" viewBox="0 0 1200 260" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Siddharth Gaur — AI/ML Engineer">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B1120"/>
      <stop offset="45%" stop-color="#12244D"/>
      <stop offset="75%" stop-color="#1E3A8A"/>
      <stop offset="100%" stop-color="#5B21B6"/>
    </linearGradient>
    <linearGradient id="rule" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#60A5FA" stop-opacity="0"/>
      <stop offset="50%" stop-color="#60A5FA" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#A78BFA" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="260" fill="url(#bg)"/>

  <!-- decorative message-passing graph motif, left cluster -->
  <g stroke="#60A5FA" stroke-opacity="0.22" stroke-width="1.2" fill="none">
    <line x1="60" y1="50" x2="140" y2="30"/>
    <line x1="140" y1="30" x2="220" y2="70"/>
    <line x1="60" y1="50" x2="90" y2="140"/>
    <line x1="90" y1="140" x2="180" y2="160"/>
    <line x1="180" y1="160" x2="280" y2="110"/>
    <line x1="220" y1="70" x2="280" y2="110"/>
    <line x1="90" y1="140" x2="60" y2="220"/>
    <line x1="180" y1="160" x2="240" y2="210"/>
    <line x1="60" y1="220" x2="240" y2="210"/>
  </g>
  <g fill="#93C5FD" fill-opacity="0.55">
    <circle cx="60" cy="50" r="3.5"/>
    <circle cx="140" cy="30" r="3"/>
    <circle cx="220" cy="70" r="3.5"/>
    <circle cx="90" cy="140" r="4"/>
    <circle cx="180" cy="160" r="3"/>
    <circle cx="280" cy="110" r="3.5"/>
    <circle cx="60" cy="220" r="3"/>
    <circle cx="240" cy="210" r="3.5"/>
  </g>
  <circle cx="90" cy="140" r="4.5" fill="#A78BFA" fill-opacity="0.8">
    <animate attributeName="fill-opacity" values="0.3;0.9;0.3" dur="3.4s" repeatCount="indefinite"/>
  </circle>

  <!-- decorative message-passing graph motif, right cluster -->
  <g stroke="#A78BFA" stroke-opacity="0.22" stroke-width="1.2" fill="none">
    <line x1="950" y1="40" x2="1030" y2="25"/>
    <line x1="1030" y1="25" x2="1110" y2="60"/>
    <line x1="950" y1="40" x2="960" y2="130"/>
    <line x1="960" y1="130" x2="1050" y2="150"/>
    <line x1="1050" y1="150" x2="1150" y2="100"/>
    <line x1="1110" y1="60" x2="1150" y2="100"/>
    <line x1="960" y1="130" x2="980" y2="220"/>
    <line x1="1050" y1="150" x2="1120" y2="200"/>
    <line x1="980" y1="220" x2="1120" y2="200"/>
  </g>
  <g fill="#C4B5FD" fill-opacity="0.55">
    <circle cx="950" cy="40" r="3.5"/>
    <circle cx="1030" cy="25" r="3"/>
    <circle cx="1110" cy="60" r="3.5"/>
    <circle cx="960" cy="130" r="4"/>
    <circle cx="1050" cy="150" r="3"/>
    <circle cx="1150" cy="100" r="3.5"/>
    <circle cx="980" cy="220" r="3"/>
    <circle cx="1120" cy="200" r="3.5"/>
  </g>
  <circle cx="1050" cy="150" r="4.5" fill="#60A5FA" fill-opacity="0.8">
    <animate attributeName="fill-opacity" values="0.9;0.3;0.9" dur="3.4s" repeatCount="indefinite"/>
  </circle>

  <!-- identity -->
  <text x="600" y="115" text-anchor="middle" font-family="'JetBrains Mono','Fira Code',Consolas,monospace" font-size="52" font-weight="700" fill="#F8FAFC">Siddharth Gaur</text>

  <line x1="420" y1="140" x2="780" y2="140" stroke="url(#rule)" stroke-width="1.5"/>

  <text x="600" y="168" text-anchor="middle" font-family="'JetBrains Mono','Fira Code',Consolas,monospace" font-size="16" fill="#BFDBFE">AI/ML Engineer · Graph Neural Networks · LLM Agents · Retrieval Systems</text>

  <text x="600" y="205" text-anchor="middle" font-family="'JetBrains Mono','Fira Code',Consolas,monospace" font-size="13" fill="#93C5FD" fill-opacity="0.85">Every number below traces to a committed result, not a claim.<tspan fill="#60A5FA">_<animate attributeName="opacity" values="1;0;1" dur="1.1s" repeatCount="indefinite"/></tspan></text>
</svg>
