</g>
<line x1="900.0" y1="26" x2="900.0" y2="70" stroke="#E3E8F0"/>
<g opacity="0"><animate attributeName="opacity" from="0" to="1" dur="0.6s" begin="0.75s" fill="freeze"/>
<text x="1050.0" y="47" text-anchor="middle" font-family="'Segoe UI',Inter,system-ui,-apple-system,Helvetica,Arial,sans-serif" font-size="27" font-weight="700" fill="#B45309">0</text>
<text x="1050.0" y="66" text-anchor="middle" font-family="'SFMono-Regular',ui-monospace,'Cascadia Mono',Consolas,monospace" font-size="12.5" fill="#475569">fabricated numbers</text>
<text x="1050.0" y="82" text-anchor="middle" font-family="'SFMono-Regular',ui-monospace,'Cascadia Mono',Consolas,monospace" font-size="10.5" fill="#7A8AA0">by design</text>
</g>
<g clip-path="url(#panel)"><rect x="-170" y="94" width="170" height="2" fill="#0D9488" opacity="0.9" rx="1"><animate attributeName="x" from="-170" to="1200" dur="4.5s" begin="1.2s" repeatCount="indefinite"/></rect></g>
