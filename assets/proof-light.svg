<text x="450.0" y="47" text-anchor="middle" font-family="'Segoe UI',Inter,system-ui,-apple-system,Helvetica,Arial,sans-serif" font-size="27" font-weight="700" fill="#B45309">1</text>
<text x="450.0" y="66" text-anchor="middle" font-family="'SFMono-Regular',ui-monospace,'Cascadia Mono',Consolas,monospace" font-size="12.5" fill="#475569">PR merged</text>
<text x="450.0" y="82" text-anchor="middle" font-family="'SFMono-Regular',ui-monospace,'Cascadia Mono',Consolas,monospace" font-size="10.5" fill="#7A8AA0">pdfplumber</text>
</g>
<line x1="600.0" y1="26" x2="600.0" y2="70" stroke="#E3E8F0"/>
<g opacity="0"><animate attributeName="opacity" from="0" to="1" dur="0.6s" begin="0.50s" fill="freeze"/>
<text x="750.0" y="47" text-anchor="middle" font-family="'Segoe UI',Inter,system-ui,-apple-system,Helvetica,Arial,sans-serif" font-size="27" font-weight="700" fill="#B45309">4</text>
<text x="750.0" y="66" text-anchor="middle" font-family="'SFMono-Regular',ui-monospace,'Cascadia Mono',Consolas,monospace" font-size="12.5" fill="#475569">PRs open</text>
