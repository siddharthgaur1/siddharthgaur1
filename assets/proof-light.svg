<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="96" viewBox="0 0 1200 96" role="img" aria-label="22 public repos with every CI green. 1 PR merged into pdfplumber. 4 PRs open at PyTorch Geometric. 0 fabricated numbers.">
<defs><clipPath id="panel"><rect width="1200" height="96" rx="10"/></clipPath></defs>
<rect width="1200" height="96" rx="10" fill="#FFFFFF"/>
<rect x="0.5" y="0.5" width="1199" height="95" rx="10" fill="none" stroke="#E3E8F0"/>
<g opacity="0"><animate attributeName="opacity" from="0" to="1" dur="0.6s" begin="0.00s" fill="freeze"/>
<text x="150.0" y="47" text-anchor="middle" font-family="'Segoe UI',Inter,system-ui,-apple-system,Helvetica,Arial,sans-serif" font-size="27" font-weight="700" fill="#B45309">22</text>
