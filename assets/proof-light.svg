<text x="150.0" y="82" text-anchor="middle" font-family="'SFMono-Regular',ui-monospace,'Cascadia Mono',Consolas,monospace" font-size="10.5" fill="#7A8AA0">every CI green</text>
</g>
<line x1="300.0" y1="26" x2="300.0" y2="70" stroke="#E3E8F0"/>
