<svg width="1200" height="64" viewBox="0 0 1200 64" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="19 active repos, all green CI. 1 merged open-source PR. 3 real bugs found and fixed. 0 fabricated benchmark numbers.">
  <defs>
    <linearGradient id="strip-line" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#60A5FA" stop-opacity="0"/>
      <stop offset="12%" stop-color="#60A5FA" stop-opacity="0.55"/>
      <stop offset="50%" stop-color="#A78BFA" stop-opacity="0.55"/>
      <stop offset="88%" stop-color="#F472B6" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#F472B6" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <line x1="40" y1="18" x2="1160" y2="18" stroke="url(#strip-line)" stroke-width="1.2"/>

  <g font-family="'JetBrains Mono','Fira Code',Consolas,monospace" font-size="12.5">
    <g>
      <circle cx="160" cy="18" r="4" fill="#60A5FA">
        <animate attributeName="r" values="4;5.5;4" dur="2.6s" begin="0s" repeatCount="indefinite"/>
      </circle>
      <text x="160" y="42" text-anchor="middle" fill="#E2E8F0">19 active repos</text>
      <text x="160" y="58" text-anchor="middle" fill="#93C5FD" font-size="11">all green CI</text>
    </g>
    <g>
      <circle cx="460" cy="18" r="4" fill="#A78BFA">
        <animate attributeName="r" values="4;5.5;4" dur="2.6s" begin="0.5s" repeatCount="indefinite"/>
      </circle>
      <text x="460" y="42" text-anchor="middle" fill="#E2E8F0">1 merged OSS PR</text>
      <text x="460" y="58" text-anchor="middle" fill="#93C5FD" font-size="11">pdfplumber (jsvine)</text>
    </g>
    <g>
      <circle cx="760" cy="18" r="4" fill="#F472B6">
        <animate attributeName="r" values="4;5.5;4" dur="2.6s" begin="1s" repeatCount="indefinite"/>
      </circle>
      <text x="760" y="42" text-anchor="middle" fill="#E2E8F0">3 real bugs found</text>
      <text x="760" y="58" text-anchor="middle" fill="#93C5FD" font-size="11">found in my own code, fixed</text>
    </g>
    <g>
      <circle cx="1060" cy="18" r="4" fill="#34D399">
        <animate attributeName="r" values="4;5.5;4" dur="2.6s" begin="1.5s" repeatCount="indefinite"/>
      </circle>
      <text x="1060" y="42" text-anchor="middle" fill="#E2E8F0">0 fabricated numbers</text>
      <text x="1060" y="58" text-anchor="middle" fill="#93C5FD" font-size="11">unmeasured → left blank</text>
    </g>
  </g>
</svg>
