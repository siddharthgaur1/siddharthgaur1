<svg width="1200" height="72" viewBox="0 0 1200 72" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="19 active repos, all green CI. 1 merged open-source PR. 3 real bugs found and fixed. 0 fabricated benchmark numbers.">
  <defs>
    <linearGradient id="strip-line" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3B82F6" stop-opacity="0"/>
      <stop offset="12%" stop-color="#3B82F6" stop-opacity="0.7"/>
      <stop offset="50%" stop-color="#8B5CF6" stop-opacity="0.7"/>
      <stop offset="88%" stop-color="#EC4899" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#EC4899" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect x="1" y="1" width="1198" height="70" rx="10" fill="#000000" stroke="#18181B" stroke-width="1.5"/>

  <line x1="40" y1="26" x2="1160" y2="26" stroke="url(#strip-line)" stroke-width="1.2"/>

  <g font-family="'JetBrains Mono','Fira Code',Consolas,monospace" font-size="12.5">
    <g>
      <circle cx="160" cy="26" r="4" fill="#3B82F6">
        <animate attributeName="r" values="4;5.5;4" dur="2.6s" begin="0s" repeatCount="indefinite"/>
      </circle>
      <text x="160" y="50" text-anchor="middle" fill="#FAFAFA">19 active repos</text>
      <text x="160" y="65" text-anchor="middle" fill="#71717A" font-size="11">all green CI</text>
    </g>
    <g>
      <circle cx="460" cy="26" r="4" fill="#8B5CF6">
        <animate attributeName="r" values="4;5.5;4" dur="2.6s" begin="0.5s" repeatCount="indefinite"/>
      </circle>
      <text x="460" y="50" text-anchor="middle" fill="#FAFAFA">1 merged OSS PR</text>
      <text x="460" y="65" text-anchor="middle" fill="#71717A" font-size="11">pdfplumber (jsvine)</text>
    </g>
    <g>
      <circle cx="760" cy="26" r="4" fill="#EC4899">
        <animate attributeName="r" values="4;5.5;4" dur="2.6s" begin="1s" repeatCount="indefinite"/>
      </circle>
      <text x="760" y="50" text-anchor="middle" fill="#FAFAFA">3 real bugs found</text>
      <text x="760" y="65" text-anchor="middle" fill="#71717A" font-size="11">found in my own code, fixed</text>
    </g>
    <g>
      <circle cx="1060" cy="26" r="4" fill="#22C55E">
        <animate attributeName="r" values="4;5.5;4" dur="2.6s" begin="1.5s" repeatCount="indefinite"/>
      </circle>
      <text x="1060" y="50" text-anchor="middle" fill="#FAFAFA">0 fabricated numbers</text>
      <text x="1060" y="65" text-anchor="middle" fill="#71717A" font-size="11">unmeasured → left blank</text>
    </g>
  </g>
</svg>
